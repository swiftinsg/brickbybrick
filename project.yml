name: Focusedhouse
options:
  bundleIdPrefix: com.chuahchengxi
  deploymentTarget:
    iOS: "27.2"
targets:
  Focusedhouse:
    type: application
    platform: iOS
    sources: [Focusedhouse]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      SWIFT_VERSION: "6.0"
  FocusedhouseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FocusedhouseTests]
    dependencies:
      - target: Focusedhouse
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
schemes:
  Focusedhouse:
    build:
      targets:
        Focusedhouse: all
    test:
      targets: [FocusedhouseTests]
