name: focushouse
options:
  bundleIdPrefix: com.chuahchengxi
  deploymentTarget:
    iOS: "27.2"
targets:
  focushouse:
    type: application
    platform: iOS
    sources:
      - focushouse
      - Shared
      - path: Art/furniture.json   # furniture sprites + prices, drawn at runtime
        buildPhase: resources
      - path: Art/furniture_hobbies.json
        buildPhase: resources
    entitlements:
      path: focushouse/focushouse.entitlements
      properties: &ents
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.chuahchengxi.focushouse]
    dependencies:
      - target: RestMonitor
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "focushouse plans around your calendar events and can add your tasks to Calendar."
      SWIFT_VERSION: "6.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: ""   # no app icon yet
  RestMonitor:
    type: app-extension
    platform: iOS
    sources: [RestMonitor, Shared]
    info:
      path: RestMonitor/Info.plist
      properties:
        CFBundleDisplayName: RestMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).RestMonitor
    entitlements:
      path: RestMonitor/RestMonitor.entitlements
      properties: *ents
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.chuahchengxi.focushouse.RestMonitor
      SWIFT_VERSION: "6.0"
  focushouseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [focushouseTests]
    dependencies:
      - target: focushouse
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
schemes:
  focushouse:
    build:
      targets:
        focushouse: all
    test:
      targets: [focushouseTests]
